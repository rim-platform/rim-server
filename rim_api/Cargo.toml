[package]
name = "rim_api"
description = "GraphQL schema and resolvers of the RIM server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
actix-web = "4.11.0"
async-graphql = { version = "7.0.17", features = ["chrono", "dataloader"] }
chrono = "0.4.42"
rim_services = { path = "../rim_services" }
uuid = { version = "1.19.0", features = ["v4","v7"] }
rim_core = { path = "../rim_core" }
serde_json = "1.0.145"
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures-util = "0.3"
async-stream = "0.3"
tracing = "0.1"
base64 = "0.22"
metrics = "0.24.6"
async-trait = "0.1.89"

[features]
e2e-tests = []

[dev-dependencies]
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
rim_services = { path = "../rim_services", features = ["mocks"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time"] }
sea-orm = { version = "2.0.0-rc.20", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
migration = { path = "../migration" }
rim_auth = { path = "../rim_auth", features = ["testing"] }
rim_identity = { path = "../rim_identity", features = ["testing"] }
rim_infra_db = { path = "../rim_infra_db" }
rim_infra_services = { path = "../rim_infra_services" }
sha2 = "0.10.9"
entity = { path = "../entity" }
rim_server = { path = "../rim_server" }
rim_s2s = { path = "../rim_s2s", features = ["testing"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
# A WebSocket client for the transport tests; the versions actix-web builds on.
actix-codec = "0.5.2"
actix-http = "3.11.2"
tempfile = "3"
async-trait = "0.1.89"
anyhow = "1.0.99"
ed25519-dalek = "3.0"
hmac = "0.12.1"
openmls = "=0.9.1"
openmls_rust_crypto = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
