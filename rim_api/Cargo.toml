[package]
name = "rim_api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
async-graphql = { version = "7.0.17", features = ["chrono", "dataloader"] }
chrono = "0.4.42"
rim_services = { path = "../rim_services", features = ["mocks"] }
rim_infra_services = { path = "../rim_infra_services" }
uuid = { version = "1.19.0", features = ["v4","v7"] }
rim_core = { path = "../rim_core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1", features = ["sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-stream = "0.3"
tracing = "0.1"
base64 = "0.22"

[features]
e2e-tests = []

[dev-dependencies]
async-trait = "0.1.89"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
sea-orm = { version = "2.0.0-rc.20", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
migration = { path = "../migration" }
rim_infra_db = { path = "../rim_infra_db" }
rim_infra_services = { path = "../rim_infra_services" }
serde_json = "1.0.145"
entity = { path = "../entity" }
tracing-subscriber = "0.3.20"
uuid = { version = "1.19.0", features = ["v4"] }
