[workspace]
resolver = "3"
members = [
    "rim_api",
    "rim_auth",
    "rim_core",
    "rim_identity",
    "rim_infra_db",
    "entity",
    "rim_logging",
    "migration",
    "rim_server",
    "rim_services",
    "rim_infra_services",
]

# `openmls` names `openmls_sqlite_storage` as an optional dependency, whose `rusqlite` links a
# `libsqlite3-sys` that conflicts with SeaORM's optional SQLite driver in the lock file. The
# server never enables it, so an empty crate stands in.
[patch.crates-io]
openmls_sqlite_storage = { path = "vendor/openmls_sqlite_storage" }
