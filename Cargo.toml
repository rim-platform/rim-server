[workspace]
resolver = "3"
members = [
    "rim_api",
    "rim_auth",
    "rim_core",
    "rim_identity",
    "rim_s2s",
    "rim_infra_db",
    "entity",
    "rim_logging",
    "migration",
    "rim_server",
    "rim_services",
    "rim_infra_services",
]

# The one release version every crate carries; `rim-server --version`, `/healthz` and
# `serverInfo.version` report it.
[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rim-platform/rim-server"
