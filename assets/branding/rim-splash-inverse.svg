<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -28 230 136" role="img" aria-label="RIM">
  <style>
    @keyframes rim-glow-wide { 0%, 100% { opacity: .24 } 50% { opacity: .76 } }
    @keyframes rim-glow-halo { 0%, 100% { opacity: .36 } 50% { opacity: .96 } }
    @keyframes rim-glow-core { 0%, 100% { opacity: .3 } 50% { opacity: .86 } }
    @keyframes rim-glow-bolt { 0%, 100% { fill: #F2541B } 50% { fill: #FF8450 } }
    .wide { animation: rim-glow-wide 1.8s ease-in-out infinite }
    .halo { animation: rim-glow-halo 1.8s ease-in-out infinite }
    .core { animation: rim-glow-core 1.8s ease-in-out infinite }
    .bolt { animation: rim-glow-bolt 1.8s ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) {
      .wide, .halo, .core, .bolt { animation: none }
      .wide { opacity: .35 } .halo { opacity: .5 } .core { opacity: .45 }
    }
  </style>
  <defs>
    <filter id="wide" filterUnits="userSpaceOnUse" x="20" y="-60" width="170" height="200"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="40" y="-40" width="130" height="160"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="core" filterUnits="userSpaceOnUse" x="60" y="-20" width="90" height="120"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>
  <g fill="#EDEEF0">
    <g transform="translate(-3.144 1.904) scale(.762)">
      <rect x="12" y="8" width="20" height="84" rx="4"/>
      <path fill-rule="evenodd" d="M40 8 H60 A24 24 0 0 1 60 56 H40 Z M40 25 V39 H58.5 A7 7 0 0 0 58.5 25 Z"/>
      <path d="M54 64 H75 L92 92 H71 Z"/>
      <circle cx="43" cy="68" r="6" fill="#F2541B"/>
    </g>
    <path d="M140 72 V8 H158 L175 40 L192 8 H210 V72 H194 V36 L180 62 H170 L156 36 V72 Z"/>
  </g>
  <path class="wide" d="M115 8 L84 44 H100 L91 72 L122 36 H106 Z" fill="#F2541B" filter="url(#wide)" opacity=".35"/>
  <path class="halo" d="M115 8 L84 44 H100 L91 72 L122 36 H106 Z" fill="#F2541B" filter="url(#halo)" opacity=".5"/>
  <path class="core" d="M115 8 L84 44 H100 L91 72 L122 36 H106 Z" fill="#FF8A5C" filter="url(#core)" opacity=".45"/>
  <path class="bolt" d="M115 8 L84 44 H100 L91 72 L122 36 H106 Z" fill="#F2541B"/>
</svg>
