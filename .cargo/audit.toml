# Configuration for `cargo audit` (https://github.com/rustsec/rustsec).
#
# RUSTSEC-2023-0071 — Marvin Attack timing sidechannel in the `rsa` crate.
# `rsa` is not a direct dependency of this workspace. It is pulled in
# transitively only via `sqlx-mysql` (a `sqlx` feature), and every crate in
# this workspace that depends on `sqlx`/`sea-orm` enables only the
# `sqlx-postgres` feature — `cargo tree -i rsa` confirms `rsa` is not
# reachable from any resolved build target. The vulnerable RSA decryption
# code path is therefore never compiled into, or exercised by, this
# application. No upstream fix is available yet (tracked upstream in the
# `rsa` crate and in `sqlx`). Revisit and remove this ignore once `sqlx`
# and/or `rsa` ship a fix, or if `sqlx-mysql`/MySQL support is ever added to
# this workspace (at which point this advisory would become a live risk).
#
# RUSTSEC-2026-0235 — insufficient archive validation in `rkyv` 0.7 (fix only
# in 0.8.17+). `rkyv` is an optional dependency of `rust_decimal` that is in
# Cargo.lock but not enabled: `cargo tree -i rkyv --workspace --all-features
# --target all` prints nothing, so it is never compiled. Revisit if anything
# enables `rust_decimal`'s `rkyv` features.
#
# RUSTSEC-2026-0258 — unbounded empty DATA frames in `h2` 0.3 (fix only in
# 0.4.16+). `h2` 0.3 is pulled in by `actix-http` 3.x (actix-web 4's `http2`
# feature, also enabled by `async-graphql-actix-web`); there is no fixed 0.3
# release and actix-web 4 cannot move to `h2` 0.4. It is compiled but not
# reachable: `rim_server/src/server.rs` uses `HttpServer::bind` (plain TCP,
# HTTP/1.1 only — no TLS/ALPN and no `bind_auto_h2c`), so the server never
# speaks HTTP/2. Revisit if the server ever binds with TLS or h2c, or once
# actix-http ships on `h2` 0.4.
# RUSTSEC-2026-0330 and RUSTSEC-2026-0331 — panics on short seeds and short keys in the
# hybrid KEM of `libcrux-kem` 0.0.9 (fixed in 0.0.10). `libcrux-kem` is in Cargo.lock only
# through `hpke-rs-libcrux`, the optional libcrux backend of `hpke-rs` 0.7 that
# `openmls_rust_crypto` 0.6 declares but nothing here enables: `cargo tree -i libcrux-kem
# --workspace --all-features --target all` prints nothing, so it is never compiled.
# `hpke-rs-libcrux` 0.7 pins `libcrux-kem` `=0.0.9`; the fixed 0.8 needs `hpke-rs` 0.8, which
# `openmls_rust_crypto` has not moved to. Revisit when `openmls_rust_crypto` ships on
# `hpke-rs` 0.8, or if anything enables the libcrux backend.
#
# RUSTSEC-2026-0253 (unsound) — `LruCache::pop` in `lru` 0.16 is not panic-safe: a key whose
# `Drop` panics during `pop` can leave a freed entry reachable (fixed in 0.18.2). `lru` is
# compiled only through async-graphql's `dataloader` feature, for its opt-in `LruCache`;
# async-graphql 7.2.1 and 8.0.0-rc.5 both require `lru` ^0.16.2, so no release takes the fix.
# Nothing constructs that cache: every loader in `rim_api/src/lib.rs` is built with
# `DataLoader::new`, whose cache is `NoCache`, and the `apollo_persisted_queries` feature (the
# other `lru` user) is off. Even with the cache, reaching the defect needs a key type whose
# `Drop` panics, and the loader keys are plain ids. Remove once an async-graphql release depends
# on `lru` 0.18.2 or later and the lockfile takes it; revisit sooner if anything builds a
# loader with `LruCache` or enables `apollo_persisted_queries`.
#
# RUSTSEC-2025-0057 (unmaintained) — `fxhash` 0.2, reached through `scraper` 0.22 → `selectors`
# 0.26, which link previews use to read a page's metadata. No vulnerability is reported, only
# that the crate is no longer maintained. `scraper` 0.25 and later use a `selectors` that moved
# to `rustc-hash`, but that is a breaking upgrade of the preview parser. Remove once the
# workspace moves to `scraper` 0.25 or later.
#
# RUSTSEC-2026-0173 (unmaintained) — `proc-macro-error2` 2.0, reached through
# `openmls_rust_crypto` → `hpke-rs` 0.7 → `libcrux-sha3`/`libcrux-intrinsics` → `hax-lib` 0.3 →
# `hax-lib-macros`. It runs only at build time, inside a proc macro, and is never linked into
# the server binary; no vulnerability is reported. `hax-lib-macros` 0.4 dropped it, but the
# `libcrux` crates `hpke-rs` 0.7 uses require `hax-lib` 0.3. Remove once the `libcrux` crates
# in the lockfile move to `hax-lib` 0.4 or later (through an `hpke-rs` or
# `openmls_rust_crypto` release).
#
# RUSTSEC-2026-0387 — timing variability in `crypto-bigint` 0.5.5 operations meant to be
# constant-time. It comes through `elliptic-curve` 0.13 (`p256`, `p384`, `k256`) of
# `hpke-rs-rust-crypto` and `openmls_rust_crypto` 0.6, the OpenMLS provider of
# `rim_infra_services/src/e2ee/openmls_wire.rs`. The server only decodes MLS framing and
# validates key package signatures and hashes over public data; it never creates or loads a
# group, never holds an elliptic-curve private key, and accepts only cipher suite 0x004f
# (X-Wing with Ed25519), so no secret passes through those curves and a timing difference has
# nothing to reveal. The fix, `crypto-bigint` 0.7, needs `elliptic-curve` 0.14, which no
# `openmls_rust_crypto` release uses yet. Drop this once one does.
#
# The two unmaintained entries are listed so that `--deny unmaintained` can be switched on
# without failing on them; CI runs `cargo audit --deny unsound` today.
[advisories]
ignore = [
    "RUSTSEC-2026-0330",
    "RUSTSEC-2026-0331",
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0235",
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0253",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2026-0387",
]
