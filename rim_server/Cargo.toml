[package]
name = "rim_server"
description = "RIM server: HTTP bootstrap and composition root"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rim_api = {path = "../rim_api" }
rim_core = { path = "../rim_core" }
rim_infra_db = { path = "../rim_infra_db" }
rim_infra_services = { path = "../rim_infra_services" }
rim_services = { path = "../rim_services" }
sea-orm = "2.0.0-rc.20"
chrono = "0.4.42"
rim_auth = { path = "../rim_auth" }
http = "1.4.0"
actix-web = "4.11.0"
actix-cors = "0.7"
rim_logging = {path = "../rim_logging" }
dotenvy = "0.15.7"
config = "0.15.18"
serde = { version = "1.0.228", features = ["derive"] }
async-graphql-actix-web = "7.0.17"
# The WebSocket transport's actor; the same versions async-graphql-actix-web builds on.
actix = "0.13.5"
actix-http = "3.11.2"
actix-web-actors = "4.3.1"
async-channel = "2.5.0"
async-graphql = "7.0.17"
tracing = "0.1.41"
uuid = { version = "1.19.0", features = ["v7"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "fs"] }
futures-util = "0.3"
actix-multipart = "0.7"
serde_json = "1"
mime_guess = "2"
sha2 = "0.10.9"
rim_s2s = { path = "../rim_s2s" }
rim_identity = { path = "../rim_identity" }
url = "2.5"
anyhow = "1.0.99"
base64 = "0.22.1"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
migration = { path = "../migration" }
async-trait = "0.1.89"
log = "0.4"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rim_services = { path = "../rim_services", features = ["mocks"] }
rim_core = { path = "../rim_core", features = ["mocks"] }
async-trait = "0.1.89"
regex = "1"
