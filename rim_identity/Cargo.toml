[package]
name = "rim_identity"
version = "0.1.0"
edition = "2024"

[dependencies]
# `zeroize` wipes the GHASH key; `aes` is listed only to turn on its `zeroize` feature, which
# wipes the AES round keys.
aes = { version = "0.8.4", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
ed25519-dalek = "2.2"
hkdf = "0.12.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
uuid = { version = "1.19.0", features = ["serde"] }
zeroize = "1.8"

[features]
# Deterministic signing helpers for tests in other crates (`rim_identity::testing`).
testing = []

[package.metadata.cargo-machete]
ignored = ["aes"]
