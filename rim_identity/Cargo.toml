[package]
name = "rim_identity"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
uuid = { version = "1.19.0", features = ["serde"] }

[features]
# Deterministic signing helpers for tests in other crates (`rim_identity::testing`).
testing = []
