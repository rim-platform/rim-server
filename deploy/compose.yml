# =============================================================================
# RIM — one self-hosted server: rim-server (role `both`), PostgreSQL 17, the
# web client, and Caddy terminating TLS for one domain. Client and API share
# that origin: Caddy sends the API, discovery, server-to-server and probe paths
# to rim-server and everything else to the web client. With RIM_WEB_DOMAIN set
# in deploy/.env the web client moves to that domain and calls the API there;
# RIM_DOMAIN stays the server's name and sends browsers to the web domain.
#
#   cp deploy/.env.example deploy/.env      # then fill it in
#   docker compose -f deploy/compose.yml up -d
#
# A public relay is this file plus compose.relay.yml:
#
#   docker compose -f deploy/compose.yml -f deploy/compose.relay.yml up -d
#
# The images are the published, signed ghcr.io/rim-platform/rim-server,
# rim-imagecheck and rim-web at RIM_VERSION (default latest; pin it in
# deploy/.env). RIM_SERVER_IMAGE, RIM_IMAGECHECK_IMAGE and RIM_WEB_IMAGE name
# other images. compose.dev.yml on top builds them from local checkouts instead.
#
# Every container has a read-only root filesystem and cannot gain privileges:
# it writes only to its named volumes and to the tmpfs paths listed with it.
# The services run as unprivileged users; only caddy-init, which exits after
# one command, runs as root. No capability is held but those under cap_add.
# =============================================================================

name: rim

# Every container's output goes to Docker's json-file log, about 100 MB per service in five
# files of 20 MB: the oldest file is deleted when the newest fills, and the log goes with the
# container when it is recreated.
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-database-url: &database-url "postgres://rim:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/rim"

services:
  postgres:
    image: postgres:17-alpine
    # The image's postgres user (uid 70), which owns the data directory; the entrypoint
    # then starts the server without switching users.
    user: postgres
    environment:
      POSTGRES_USER: rim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: rim
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The server's socket and its lock file, in a directory postgres owns.
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rim -d rim"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *logging

  # Runs the migrations, then exits; the server starts after it succeeded.
  migrate:
    image: ${RIM_SERVER_IMAGE:-ghcr.io/rim-platform/rim-server:${RIM_VERSION:-latest}}
    entrypoint: ["/app/migration", "up"]
    environment:
      DATABASE_URL: *database-url
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  rim:
    image: ${RIM_SERVER_IMAGE:-ghcr.io/rim-platform/rim-server:${RIM_VERSION:-latest}}
    environment:
      DATABASE_URL: *database-url
      RUST_LOG: ${RUST_LOG:-info}
      RIM_SERVER_HOST: 0.0.0.0
      RIM_SERVER_PORT: 8080
      RIM_ROLE: both
      # The https origin clients and other servers reach this server at. Left out of
      # deploy/.env it follows RIM_DOMAIN; set empty, server-to-server traffic is off.
      RIM_PUBLIC_BASE_URL: ${RIM_PUBLIC_BASE_URL-https://${RIM_DOMAIN:?set RIM_DOMAIN in deploy/.env}}
      # The server accepts its own origin, RIM_PUBLIC_BASE_URL's, without configuration, and
      # one more: RIM_CORS_ALLOWED_ORIGIN when set, else the web client's on RIM_WEB_DOMAIN.
      RIM_CORS_ALLOWED_ORIGIN: ${RIM_CORS_ALLOWED_ORIGIN:-${RIM_WEB_DOMAIN:+https://${RIM_WEB_DOMAIN}}}
      # The hosts a key login may name. Left out of deploy/.env it is RIM_PUBLIC_BASE_URL's host,
      # or with RIM_WEB_DOMAIN set both domains, since the web client names the page's host.
      RIM_KEY_LOGIN_AUDIENCES: ${RIM_KEY_LOGIN_AUDIENCES:-${RIM_WEB_DOMAIN:+${RIM_DOMAIN},${RIM_WEB_DOMAIN}}}
      # Server key, recovery key (until moved offline), franking keys and uploads.
      RIM_DATA_DIR: /data
      RIM_STORAGE_LOCAL_PATH: /data/uploads
      # Audit events also go to stdout; the daily files /data/audit.<YYYY-MM-DD>.log keep them
      # across container restarts, for RIM_AUDIT_LOG_RETENTION_DAYS (default 90).
      RIM_AUDIT_LOG_PATH: /data
      # Caddy is the only way in and sets X-Forwarded-For itself.
      RIM_TRUST_FORWARDED_HEADERS: "true"
      RIM_FORCE_SECURE_COOKIES: "true"
      # Peers refused before they are ever pinned, comma-separated server ids.
      RIM_S2S_DENIED_PEERS: ${RIM_S2S_DENIED_PEERS:-}
      # Passed through only when set in deploy/.env; deploy/.env.example describes each.
      RIM_HANDLE_DOMAIN:
      RIM_OPEN_REGISTRATION:
      RIM_REGISTRATION_POW_BITS:
      RIM_DEFAULT_WORKSPACE:
      # The default workspace's definition, mounted below: /config/default-workspace.json.
      RIM_DEFAULT_WORKSPACE_FILE:
      RIM_SMTP_HOST:
      RIM_SMTP_PORT:
      RIM_SMTP_USERNAME:
      RIM_SMTP_PASSWORD:
      RIM_SMTP_FROM:
      RIM_SMTP_TLS:
      RIM_ENABLE_GRAPHIQL:
      RIM_NOTIFICATION_DIGEST_INTERVAL_SECS:
      RIM_HOST_ALLOWED_RELAYS:
      RIM_DM_INBOUND:
      RIM_DM_OUTBOUND:
      RIM_DM_PARTNERS:
      RIM_S2S_PEER_RATE_PER_MIN:
      RIM_S2S_SUBSCRIPTIONS_PER_PEER:
      RIM_S2S_PEER_DEAD_AFTER_HOURS:
      RIM_S2S_MAX_BODY_BYTES:
      RIM_S2S_ALLOW_HTTP:
      RIM_S2S_ALLOW_PRIVATE_ADDRESSES:
      RIM_RATE_REQUESTS_PER_MIN_PER_IP:
      RIM_RATE_MUTATIONS_PER_MIN_PER_SESSION:
      RIM_RATE_MESSAGES_PER_MIN_PER_USER:
      RIM_RATE_MESSAGES_BURST:
      RIM_RATE_WS_CONNECTIONS_PER_USER:
      RIM_RATE_SUBSCRIPTIONS_PER_CONNECTION:
      RIM_API_MAX_BATCH:
      RIM_INSTANCE_NOTICE:
      RIM_TERMS_URL:
      RIM_TERMS_FILE:
      RIM_ABUSE_CONTACT:
      RIM_MINIMUM_AGE:
      RIM_LIMIT_WORKSPACES_PER_USER:
      RIM_LIMIT_MEMBERS_PER_WORKSPACE:
      RIM_LIMIT_CHANNELS_PER_WORKSPACE:
      RIM_LIMIT_DEVICES_PER_USER:
      RIM_LIMIT_DM_REQUESTS_PER_DAY:
      RIM_LIMIT_MACROS_PER_WORKSPACE:
      RIM_LIMIT_PIPELINES_PER_WORKSPACE:
      RIM_LIMIT_PLUGINS_PER_WORKSPACE:
      RIM_LIMIT_INVITES_PER_USER_PER_DAY:
      RIM_LIMIT_INVITE_MAX_USES:
      RIM_LIMIT_MESSAGE_BYTES:
      RIM_LIMIT_PENDING_INVITES_PER_USER:
      RIM_LIMIT_ACCOUNTS:
      RIM_PROBATION_HOURS:
      RIM_RATE_PROBATION_MESSAGES_PER_MIN:
      RIM_AVATAR_UPLOADS_PER_HOUR:
      RIM_AVATAR_UPLOADS_PER_DAY:
      RIM_ACCOUNT_DELETION_GRACE_DAYS:
      RIM_AUDIT_LOG_RETENTION_DAYS:
      RIM_AUDIT_EXPORT_RETENTION_DAYS:
      RIM_RESERVED_NAMES:
      RIM_LINK_PREVIEW_CONCURRENCY:
      # Days command audit rows are kept; older ones are exported to /data/audit-exports and
      # deleted daily. Unset keeps them forever.
      RIM_AUDIT_RETENTION_DAYS:
      # Prometheus metrics at /metrics on their own port. The port stays unpublished and must
      # stay on the internal network: scrape it from a Prometheus container attached there,
      # never route it through Caddy.
      # RIM_METRICS_ADDR: 0.0.0.0:9090
      # Optional features switched off, comma-separated: attachments, link_previews, email,
      # custom_emoji, workspace_plugins, ai_commands, avatars. A switched-off feature's API
      # fails with FEATURE_DISABLED.
      RIM_FEATURES_DISABLED:
      # The profile picture check: every uploaded picture is scored by the imagecheck service
      # and refused at RIM_AVATAR_CHECK_BLOCK, stored and reported to the operators at
      # RIM_AVATAR_CHECK_REPORT. Set RIM_AVATAR_CHECK_URL empty to store pictures unchecked.
      RIM_AVATAR_CHECK_URL: ${RIM_AVATAR_CHECK_URL-http://imagecheck:8090}
      RIM_AVATAR_CHECK_BLOCK:
      RIM_AVATAR_CHECK_REPORT:
    # The image's rim user (uid 1001) writes only to this volume and /tmp. The terms of use
    # are read from /config/terms.md when RIM_TERMS_FILE names it, and the default workspace's
    # definition from /config/default-workspace.json when RIM_DEFAULT_WORKSPACE_FILE names it.
    volumes:
      - rim_data:/data
      - ./terms.md:/config/terms.md:ro
      - ./default-workspace.json:/config/default-workspace.json:ro
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # `egress` lets it reach other servers; no port is published, so only Caddy reaches it.
    networks: [internal, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Ready: the database answers, no migration is pending, the key files are readable.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  # Scores profile pictures for sexual content, gore and violence (imagecheck/README.md). On the
  # internal network only: it reaches nothing and only rim reaches it. rim does not wait for
  # it; while it is down, picture uploads fail and everything else works.
  imagecheck:
    image: ${RIM_IMAGECHECK_IMAGE:-ghcr.io/rim-platform/rim-imagecheck:${RIM_VERSION:-latest}}
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]
    # About 200 MB resident; two inference threads.
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  # The web client: static files behind nginx. The published image is built with the
  # GraphQL endpoint `/api`, this origin, so one image serves any domain.
  web:
    image: ${RIM_WEB_IMAGE:-ghcr.io/rim-platform/rim-web:${RIM_VERSION:-latest}}
    # nginx runs as the image's nginx user (uid 101); its temporary files and its pid and
    # lock files go to tmpfs directories it owns.
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /run:uid=101,gid=101
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  # Hands Caddy's volumes to the user Caddy runs as, then exits; Caddy starts after it
  # succeeded. Root, with only the capabilities that change and traverse other users' files.
  caddy-init:
    image: caddy:2
    user: "0:0"
    entrypoint: ["chown", "-R", "65534:65534", "/data", "/config"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    network_mode: none
    restart: "no"
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2
    # The image's nobody user. Docker lets any user of a container bind ports below 1024.
    user: "65534:65534"
    environment:
      RIM_DOMAIN: ${RIM_DOMAIN:?set RIM_DOMAIN in deploy/.env}
      RIM_WEB_DOMAIN: ${RIM_WEB_DOMAIN:-}
    ports:
      - "${RIM_HTTP_PORT:-80}:80"
      - "${RIM_HTTPS_PORT:-443}:443"
      - "${RIM_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the CA in /data/caddy, the autosaved configuration in /config/caddy.
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    # The image's caddy binary carries the file capability cap_net_bind_service, and the
    # kernel refuses to run it in a container that may not hold it. It is the one capability
    # Caddy holds, and it allows nothing any user in the container may not do already.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [internal, egress]
    depends_on:
      caddy-init:
        condition: service_completed_successfully
      rim:
        condition: service_started
    restart: unless-stopped
    logging: *logging

networks:
  # No way out: the database talks to the server and the migrations only.
  internal:
    internal: true
  egress: {}

volumes:
  postgres_data:
  rim_data:
  caddy_data:
  caddy_config:
