# =============================================================================
# RIM — a public relay: compose.yml with the public relay's quotas and
# proof-of-work signups.
#
#   docker compose -f deploy/compose.yml -f deploy/compose.relay.yml up -d
#
# deploy/.env chooses what the relay is, with no default:
#   RIM_ROLE          relay, or both to host workspaces as well
#   RIM_CADDYFILE     ./Caddyfile.relay (the API alone) or ./Caddyfile (with
#                     the web client)
#   COMPOSE_PROFILES  web, to start the web client ./Caddyfile serves
# The project's relay, relay.rim-platform.org, runs `both` with the web client
# on chat.rim-platform.org (RIM_WEB_DOMAIN). Set RIM_DOMAIN in deploy/.env to
# your relay's host name; Caddy answers for it alone (and RIM_WEB_DOMAIN), so
# the apex of the domain can serve a website from elsewhere.
# =============================================================================

name: rim-relay

services:
  rim:
    environment:
      RIM_ROLE: "${RIM_ROLE:?set RIM_ROLE in deploy/.env: relay, or both to host workspaces}"
      # Signups: a proof-of-work of 24 bits (about 16.7 million hashes) or an invite.
      RIM_REGISTRATION_POW_BITS: ${RIM_REGISTRATION_POW_BITS:-24}
      # Quotas per local user.
      RIM_RELAY_QUEUE_BYTES_PER_USER: ${RIM_RELAY_QUEUE_BYTES_PER_USER:-67108864}
      RIM_RELAY_CARD_MAX_BYTES: ${RIM_RELAY_CARD_MAX_BYTES:-131072}
      RIM_RELAY_KEY_PACKAGES_PER_DEVICE: ${RIM_RELAY_KEY_PACKAGES_PER_DEVICE:-100}
      RIM_RELAY_DEVICES_PER_USER: ${RIM_RELAY_DEVICES_PER_USER:-32}
      RIM_S2S_DEVICE_RATE_PER_MIN: ${RIM_S2S_DEVICE_RATE_PER_MIN:-120}
      RIM_RELAY_FORWARDS_PER_USER_PER_DAY: ${RIM_RELAY_FORWARDS_PER_USER_PER_DAY:-50000}
      RIM_RELAY_DM_REQUESTS_PER_DAY: ${RIM_RELAY_DM_REQUESTS_PER_DAY:-20}
      RIM_RELAY_RETENTION_DAYS: ${RIM_RELAY_RETENTION_DAYS:-30}

  # The web client starts only with the `web` profile (COMPOSE_PROFILES=web).
  web:
    profiles: [web]

  caddy:
    volumes:
      - "${RIM_CADDYFILE:?set RIM_CADDYFILE in deploy/.env: ./Caddyfile.relay, or ./Caddyfile with the web client}:/etc/caddy/Caddyfile:ro"
