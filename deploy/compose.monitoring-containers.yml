# =============================================================================
# RIM — container metrics: compose.monitoring.yml plus cAdvisor, so Alloy also
# sends each compose service's CPU and memory use. Rootful Docker on Linux with
# the overlay2 storage driver only.
#
#   docker compose -f deploy/compose.yml -f deploy/compose.monitoring.yml \
#     -f deploy/compose.monitoring-containers.yml up -d
#   docker compose -f deploy/compose.yml -f deploy/compose.relay.yml \
#     -f deploy/compose.monitoring.yml \
#     -f deploy/compose.monitoring-containers.yml up -d
#
# Only docker-proxy mounts the Docker socket, and it answers cAdvisor alone,
# on the `docker-api` network, for the read-only calls cAdvisor makes: the
# daemon's version and info and the inspection of one container by id.
# DOCKER_GID in deploy/.env is the socket's group. monitoring-containers.alloy
# is the scrape configuration. Nothing is published and neither service has a
# way out.
# =============================================================================

services:
  alloy:
    volumes:
      - ./monitoring-containers.alloy:/etc/alloy/config.d/monitoring-containers.alloy:ro

  # Every method but GET and HEAD is refused, and every path but these: HEAD /_ping,
  # GET /version, /info and /containers/<64-hex id>/json, with or without an API version.
  docker-proxy:
    image: wollomatic/socket-proxy:1.13.1
    command:
      - -listenip=0.0.0.0
      - -allowfrom=cadvisor
      - -allowHEAD=/_ping
      - -allowGET=(/v1\.[0-9]+)?/(version|info|containers/[0-9a-f]{64}/json)
    # The image's unprivileged user, with the socket's group to reach the socket.
    group_add:
      - ${DOCKER_GID:?set DOCKER_GID in deploy/.env to the group of /var/run/docker.sock}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # CPU and memory per container, labelled with its compose project and service. Reads the
  # host's cgroup tree (the host cgroup namespace) and, for each container, the layer id
  # Docker records for it; it runs unprivileged and without capabilities.
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    user: "65534:65534"
    command:
      - --docker=tcp://docker-proxy:2375
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --enable_metrics=cpu,memory
    cgroup: host
    volumes:
      - /var/lib/docker/image/overlay2/layerdb/mounts:/var/lib/docker/image/overlay2/layerdb/mounts:ro
    # `internal` for Alloy's scrapes on port 8080, `docker-api` for the proxy.
    networks: [internal, docker-api]
    depends_on: [docker-proxy]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  # docker-proxy and cAdvisor only, with no way out.
  docker-api:
    internal: true
