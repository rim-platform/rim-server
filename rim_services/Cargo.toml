[package]
name = "rim_services"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.17"
async-trait = "0.1.89"
anyhow = "1.0.99"
rim_core = {path = "../rim_core"}
serde_json = "1.0.145"

serde = { version = "1.0.228", features = ["derive"], optional = true }
chrono = "0.4.42"

[dev-dependencies]
mockall = "0.13"

[dependencies.mockall]
version = "0.13"
optional = true

[features]
default = []
serde = ["dep:serde"]
mocks = ["dep:mockall"]
