[package]
name = "rim_services"
description = "RIM service traits, commands, queries and DTOs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
thiserror = "2.0.17"
async-trait = "0.1.89"
anyhow = "1.0.99"
rim_core = { path = "../rim_core" }
serde_json = "1.0.145"
regex = "1"
tracing = "0.1"

serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }
sha2 = "0.10.9"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
mockall = "0.13"

[dependencies.mockall]
version = "0.13"
optional = true

[features]
default = []
mocks = ["dep:mockall"]
