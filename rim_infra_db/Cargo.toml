[package]
name = "rim_infra_db"
version = "0.1.0"
edition = "2024"

[dependencies]
rim_core = { path = "../rim_core" }
entity = {path = "../entity"}
async-trait = "0.1.89"
sea-orm = "2.0.0-rc.20"
tokio = { version = "1", features = ["sync"] }
chrono = "0.4.42"
sqlx-core = "0.8.6"
tracing = "0.1.41"
serde_json = "1.0.145"

[features]
db-tests = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
sea-orm = { version = "2.0.0-rc.20", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
migration = { path = "../migration" }
uuid = { version = "1", features = ["v7"] }
rim_services = { path = "../rim_services" }
rim_identity = { path = "../rim_identity", features = ["testing"] }
