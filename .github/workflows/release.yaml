name: Release

# Builds, signs and publishes ghcr.io/rim-platform/rim-server for a tag v<version>, then creates
# the GitHub release with the version's CHANGELOG.md section. Only the maintainer may push v*
# tags, and the publish job waits for the maintainer's approval in the `release` environment.
#
# Every action is pinned to a full commit SHA, with its version in a comment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rim-platform/rim-server

jobs:
  build-and-publish:
    name: Build and publish the image
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the workspace version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<pre-release>]"
            exit 1
          fi
          cargo_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ $version != "$cargo_version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $cargo_version in Cargo.toml"
            exit 1
          fi
          # A pre-release gets only its own tags; <major.minor> and latest stay on the last release.
          tags="$IMAGE:$version"$'\n'"$IMAGE:sha-${GITHUB_SHA::7}"
          if [[ $version == *-* ]]; then
            prerelease=true
          else
            prerelease=false
            tags+=$'\n'"$IMAGE:${version%.*}"$'\n'"$IMAGE:latest"
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Before anything is pushed: a version without a changelog section is not released.
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section [$VERSION] with entries"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache: a release is built from the tagged sources alone, never from layers a
      # branch build left in the Actions cache. linux/amd64 only; arm64 under emulation would
      # compile the workspace for hours, and native arm64 runners need a merge job.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=rim-server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      # A standalone SPDX file: it is attached to the GitHub release and attested to the image
      # below, so it can be read without a registry and checked against the digest.
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: rim-server-${{ steps.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # Keyless: the certificate names this workflow and the tag, issued for the job's OIDC token.
      - name: Sign the image and attest the SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SBOM: rim-server-${{ steps.version.outputs.version }}.spdx.json
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate "$SBOM" "$IMAGE@$DIGEST"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            release-notes.md
            rim-server-${{ steps.version.outputs.version }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  # A job of its own: creating a release needs contents: write, which the job holding the
  # package and signing grants does not get.
  github-release:
    name: Create the GitHub release
    needs: build-and-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-publish.outputs.version }}
          PRERELEASE: ${{ needs.build-and-publish.outputs.prerelease }}
          DIGEST: ${{ needs.build-and-publish.outputs.digest }}
        run: |
          cat >> release-notes.md <<EOF

          ### Image

          \`$IMAGE:$VERSION\` (\`$DIGEST\`), signed with cosign by this repository's release
          workflow. Verify it:

          \`\`\`sh
          cosign verify $IMAGE:$VERSION \\
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yaml@refs/tags/v$VERSION" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          flags=()
          if [[ $PRERELEASE == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "rim-server $VERSION" --notes-file release-notes.md "${flags[@]}" \
            "rim-server-$VERSION.spdx.json"
