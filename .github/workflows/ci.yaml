name: CI Pipeline

on:
  pull_request:
  push:
    branches: ["master"]

# Read-only token for every job: none pushes, comments or publishes. Caches and the coverage
# artifact use the Actions runtime token, not this one.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Caching: setup-rust-toolchain runs Swatinem/rust-cache by default (keyed per job, toolchain
# and Cargo.lock, refreshed on every run), so no job adds its own actions/cache of target/.

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Clippy
        # Lints all code, including the test code behind db-tests/infra-db-tests/e2e-tests.
        run: cargo clippy --workspace --all-targets --features "rim_infra_db/db-tests,rim_infra_services/infra-db-tests,rim_api/e2e-tests" -- -D warnings
      - name: Release version script
        run: scripts/release/test-set-version.sh

  test_and_coverage:
    name: Test & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Test with coverage (unit tests)
        # Runs the workspace tests without the database features, with default test parallelism.
        # The clean drops profiles of earlier runs; --no-report keeps this run's under
        # target/llvm-cov-target for the report step.
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-report
      - name: Test with coverage (database suites)
        # Runs the workspace with the three database test features (infra_db, API e2e,
        # infra_services). The features only gate test files, never library code. These suites
        # share one database, so --test-threads=1 keeps them isolated within each binary; cargo
        # runs the binaries one after another.
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/testdb"
        run: |
          cargo llvm-cov --workspace --no-report \
            --features "rim_infra_db/db-tests,rim_infra_services/infra-db-tests,rim_api/e2e-tests" \
            -- --test-threads=1
      - name: Coverage report
        # Merges the profiles of both runs into one lcov file.
        run: |
          mkdir -p coverage
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
      - name: Generate HTML Report
        run: genhtml coverage/lcov.info --output-directory coverage/html
      - name: Upload Coverage Artifact
        # Uploaded before the gate so the per-file report is available when the gate fails.
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
      - name: Enforce Coverage Thresholds
        # 90% is the lower bound (measured 92.95% on 2026-10-11); raise it as tests land.
        run: python3 .github/scripts/lcov_gate.py coverage/lcov.info 90 0

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # Prebuilt binary: compiling cargo-audit from source took ~4 minutes per run.
      - uses: taiki-e/install-action@cargo-audit
      # Blocking: vulnerabilities and unsound advisories fail the job; ignored advisories (each
      # with a justification and a removal condition) live in .cargo/audit.toml.
      - name: Cargo Audit
        run: cargo audit --deny unsound

  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: rim-server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
