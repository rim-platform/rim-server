name: CI Pipeline

on:
  pull_request:
  push:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (feature-gated test code)
        # Compiles (does not run) the code behind db-tests/infra-db-tests/e2e-tests so it
        # can't rot silently between feature-suite runs. Compile-only, so no DATABASE_URL
        # is needed here — the db-test *run* job below still requires Postgres for that.
        # NOTE: --all-features is intentionally NOT used here — it also enables an unrelated
        # `serde` cargo feature on rim_core/rim_services (gating derives on SkillTier/Principal)
        # that does not currently compile. That's a separate, pre-existing gap unrelated to the
        # db-tests/infra-db-tests/e2e-tests features this step targets; flagged to iron-man rather
        # than silently worked around. The explicit feature list below covers exactly what this
        # spec asks for.
        run: cargo clippy --workspace --all-targets --features "rim_infra_db/db-tests,rim_infra_services/infra-db-tests,rim_api/e2e-tests" -- -D warnings

  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-
      - name: Build
        run: cargo build --workspace --verbose
      - name: Unit Tests
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/testdb"
        run: cargo test --workspace -- --test-threads=1
      - name: Integration Tests (infra_db)
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/testdb"
        run: cargo test -p rim_infra_db --features db-tests -- --test-threads=1
      - name: Integration Tests (API e2e)
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/testdb"
        run: cargo test -p rim_api --features e2e-tests -- --test-threads=1
      - name: Integration Tests (infra_services)
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/testdb"
        run: cargo test -p rim_infra_services --features infra-db-tests -- --test-threads=1

  coverage:
    name: Coverage (LCOV)
    runs-on: ubuntu-latest
    needs: [build_and_test]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Generate Coverage (partial LCOVs)
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/testdb"
        run: |
          mkdir -p coverage/partials
          cargo llvm-cov --workspace --lcov --output-path coverage/partials/unit.info -- --test-threads=1
          cargo llvm-cov -p rim_infra_db --features db-tests --lcov --output-path coverage/partials/infra_db.info -- --test-threads=1
          cargo llvm-cov -p rim_api --features e2e-tests --lcov --output-path coverage/partials/api_e2e.info -- --test-threads=1
          cargo llvm-cov -p rim_infra_services --features infra-db-tests --lcov --output-path coverage/partials/infra_services.info -- --test-threads=1
      - name: Merge LCOV
        run: |
          lcov -a coverage/partials/unit.info \
               -a coverage/partials/infra_db.info \
               -a coverage/partials/api_e2e.info \
               -a coverage/partials/infra_services.info \
               -o coverage/lcov.info
      - name: Enforce Coverage Thresholds
        run: python3 .github/scripts/lcov_gate.py coverage/lcov.info 95 0
      - name: Generate HTML Report
        run: genhtml coverage/lcov.info --output-directory coverage/html
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Cargo Audit
        id: audit
        run: cargo audit
        continue-on-error: true
      - name: Warning on audit
        if: ${{ steps.audit.outcome == 'failure' }}
        run: echo "::warning::cargo audit found vulnerabilities (non-blocking). Check logs above."

  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: rim-server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
