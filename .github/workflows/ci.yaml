name: CI Pipeline

on:
  pull_request:
  push:
    branches: ["master"]

# Read-only token for every job: none pushes, comments or publishes. Caches and the coverage
# artifact use the Actions runtime token, not this one.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Caching: setup-rust-toolchain runs Swatinem/rust-cache by default (keyed per job, toolchain
# and Cargo.lock, refreshed on every run), so no job adds its own actions/cache of target/.

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Clippy
        # Lints all code, including the test code behind db-tests/infra-db-tests/e2e-tests.
        run: cargo clippy --workspace --all-targets --features "rim_infra_db/db-tests,rim_infra_services/infra-db-tests,rim_api/e2e-tests" -- -D warnings
      - name: Release version script
        run: scripts/release/test-set-version.sh
      - name: Deploy scripts
        # shellcheck is preinstalled on the runner.
        run: |
          shellcheck -x deploy/*.sh scripts/release/*.sh scripts/deploy/*.sh
          scripts/deploy/test-deploy.sh

  # Coverage runs as three jobs, so the serial database suites do not queue behind each other,
  # and Test & Coverage merges their lcov files and applies the gate.
  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with coverage
        # Every test that needs no database, at default test parallelism. The clean drops
        # profiles a restored cache may hold.
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov report --lcov --output-path lcov-unit.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov-unit
          path: lcov-unit.info

  api_e2e_tests:
    name: API e2e suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with coverage
        # The rim_api end-to-end suites (tests/*.rs behind e2e-tests) share one database:
        # --test-threads=1 keeps them isolated within each binary, and cargo runs the binaries
        # one after another.
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/testdb"
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report -p rim_api --features rim_api/e2e-tests --test '*' \
            -- --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov-api.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov-api
          path: lcov-api.info

  repository_tests:
    name: Repository suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with coverage
        # The rim_infra_db and rim_infra_services suites (tests/*.rs behind db-tests and
        # infra-db-tests) share one database, so they run single-threaded like the API suites.
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/testdb"
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report -p rim_infra_db -p rim_infra_services \
            --features "rim_infra_db/db-tests,rim_infra_services/infra-db-tests" --test '*' \
            -- --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov-repository.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov-repository
          path: lcov-repository.info

  test_and_coverage:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: [unit_tests, api_e2e_tests, repository_tests]
    steps:
      - uses: actions/checkout@v7
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - uses: actions/download-artifact@v8
        with:
          pattern: lcov-*
          path: coverage/parts
          merge-multiple: true
      - name: Merge coverage
        # One lcov file from the three jobs' files; a line counts as covered when any job hit it.
        run: |
          lcov -a coverage/parts/lcov-unit.info \
               -a coverage/parts/lcov-api.info \
               -a coverage/parts/lcov-repository.info \
               -o coverage/lcov.info
      - name: Generate HTML Report
        run: genhtml coverage/lcov.info --output-directory coverage/html
      - name: Upload Coverage Artifact
        # Uploaded before the gate so the per-file report is available when the gate fails.
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
      - name: Enforce Coverage Thresholds
        # 90% is the lower bound (measured 92.95% on 2026-10-11); raise it as tests land.
        run: python3 .github/scripts/lcov_gate.py coverage/lcov.info 90 0

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # Prebuilt binary: compiling cargo-audit from source took ~4 minutes per run.
      - uses: taiki-e/install-action@cargo-audit
      # Blocking: vulnerabilities and unsound advisories fail the job; ignored advisories (each
      # with a justification and a removal condition) live in .cargo/audit.toml.
      - name: Cargo Audit
        run: cargo audit --deny unsound

  imagecheck:
    name: Image check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the runtime requirements
        run: pip install --no-deps -r imagecheck/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s imagecheck/tests
      - name: Build the image
        run: docker build -t rim-imagecheck:ci imagecheck
      - name: Smoke test
        # The container as deploy/compose.yml runs it; a generated 256x256 gradient must score
        # below 0.5 in every category.
        run: |
          docker run -d --name imagecheck --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 1g -p 127.0.0.1:8090:8090 \
            rim-imagecheck:ci
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8090/healthz && break
            sleep 1
          done
          python - <<'EOF'
          import io, json, urllib.request
          from PIL import Image
          image = Image.linear_gradient("L").resize((256, 256)).convert("RGB")
          body = io.BytesIO()
          image.save(body, "PNG")
          request = urllib.request.Request(
              "http://127.0.0.1:8090/v1/check",
              data=body.getvalue(),
              headers={"Content-Type": "image/png"},
          )
          answer = json.load(urllib.request.urlopen(request, timeout=30))
          print(answer)
          assert set(answer["scores"]) == {"sexual", "gore", "violence"}, answer
          assert all(score < 0.5 for score in answer["scores"].values()), answer
          EOF
      - name: Container logs
        if: always()
        run: docker logs imagecheck || true

  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: rim-server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
