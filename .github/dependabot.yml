version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # rim_auth keeps sha2 0.10 (as `opaque-sha2`) for the OPAQUE key exchange: opaque-ke 4.0
      # takes a digest 0.10 hash, and 4.1.0-pre.2 still does. Drop once opaque-ke moves to
      # digest 0.11; patch releases of sha2 0.11 still come through.
      - dependency-name: sha2
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # rim_auth's OPAQUE vector test drives opaque-ke 4.0 with a seeded ChaCha20Rng, and
      # opaque-ke takes a rand_core 0.6 generator, which rand_chacha 0.3 is and later releases are
      # not. Drop once opaque-ke moves to a newer rand_core.
      - dependency-name: rand_chacha
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
