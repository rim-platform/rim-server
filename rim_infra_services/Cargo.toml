[package]
name = "rim_infra_services"
version = "0.1.0"
edition = "2024"

[features]
infra-db-tests = []

[dependencies]
async-trait = "0.1.89"
async-recursion = "1.1.1"
anyhow = "1.0.99"
chrono = "0.4.42"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "process", "io-util"] }
tracing = "0.1.41"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.19.0", features = ["v4", "v7"] }
sea-orm = "2.0.0-rc.20"

rim_core = { path = "../rim_core" }
rim_services = { path = "../rim_services", features = ["mocks"] }
rim_auth = { path = "../rim_auth" }
rim_infra_db = { path = "../rim_infra_db" }

[dev-dependencies]
serde_json = "1"
mockall = "0.13"
rim_core = { path = "../rim_core" }

# Needed for mock types generated in rim_core tests.

# db-tests integration test
sea-orm = { version = "2.0.0-rc.20", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
migration = { path = "../migration" }
rim_infra_db = { path = "../rim_infra_db" }
entity = { path = "../entity" }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
