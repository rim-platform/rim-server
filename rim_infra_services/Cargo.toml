[package]
name = "rim_infra_services"
version = "0.1.0"
edition = "2024"

[features]
infra-db-tests = []

[dependencies]
async-trait = "0.1.89"
async-recursion = "1.1.1"
anyhow = "1.0.99"
chrono = "0.4.42"
chrono-tz = "0.10"
dashmap = "6"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "process", "io-util", "time", "net"] }
tracing = "0.1.41"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.19.0", features = ["v4", "v7"] }
sea-orm = "2.0.0-rc.20"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
scraper = "0.22"
regex = "1"
base64 = "0.22.1"
sha2 = "0.10.9"
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls", "smtp-transport", "builder", "pool"
] }

rim_core = { path = "../rim_core" }
rim_services = { path = "../rim_services" }
rim_auth = { path = "../rim_auth" }
rim_identity = { path = "../rim_identity" }
rim_infra_db = { path = "../rim_infra_db" }

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
rim_core = { path = "../rim_core", features = ["mocks"] }
rim_services = { path = "../rim_services", features = ["mocks"] }
rim_identity = { path = "../rim_identity", features = ["testing"] }

# Needed for mock types generated via rim_core "mocks" feature.

# db-tests integration test
sea-orm = { version = "2.0.0-rc.20", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
migration = { path = "../migration" }
rim_infra_db = { path = "../rim_infra_db" }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
