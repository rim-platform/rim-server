[package]
name = "rim_infra_services"
description = "Default implementations of the RIM services"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
infra-db-tests = []

[dependencies]
async-trait = "0.1.89"
async-recursion = "1.1.1"
anyhow = "1.0.99"
chrono = "0.4.42"
chrono-tz = "0.10"
dashmap = "6"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "process", "io-util", "time", "net"] }
tracing = "0.1.41"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.19.0", features = ["v4", "v7"] }
sea-orm = "2.0.0-rc.20"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
url = "2.5"
futures-util = "0.3"
thiserror = "2.0.17"
rim_s2s = { path = "../rim_s2s" }
scraper = "0.22"
regex = "1"
base64 = "0.22.1"
sha2 = "0.10.9"
hmac = "0.12.1"
getrandom = "0.3.4"
subtle = "2.6"
zeroize = "1.8"
# The post-quantum suite is enabled on `openmls_traits` and the provider, not on `openmls`, whose
# feature pulls in `openmls_sqlite_storage`.
openmls = "=0.9.1"
openmls_rust_crypto = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls", "smtp-transport", "builder", "pool"
] }

rim_core = { path = "../rim_core" }
rim_services = { path = "../rim_services" }
rim_auth = { path = "../rim_auth" }
rim_identity = { path = "../rim_identity" }
rim_infra_db = { path = "../rim_infra_db" }
metrics = "0.24.6"
flate2 = "1.1"

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
rim_core = { path = "../rim_core", features = ["mocks"] }
rim_services = { path = "../rim_services", features = ["mocks"] }
rim_identity = { path = "../rim_identity", features = ["testing"] }
rim_s2s = { path = "../rim_s2s", features = ["testing"] }
ed25519-dalek = "2.2"
# The feature-gated database tests.
sea-orm = { version = "2.0.0-rc.20", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
migration = { path = "../migration" }
rim_infra_db = { path = "../rim_infra_db" }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
