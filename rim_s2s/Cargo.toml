[package]
name = "rim_s2s"
description = "RIM server identity and the server-to-server transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
ed25519-dalek = "3.0"
getrandom = "0.3.4"
rim_identity = { path = "../rim_identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
sfv = "0.16.0"
sha2 = "0.10.9"
thiserror = "2.0.17"

[features]
# The client halves (solving a proof-of-work, checking a host response) for tests in other
# crates.
testing = []

[dev-dependencies]
rim_identity = { path = "../rim_identity", features = ["testing"] }
