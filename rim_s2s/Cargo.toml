[package]
name = "rim_s2s"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
ed25519-dalek = "2.2"
getrandom = "0.3.4"
rim_identity = { path = "../rim_identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
sfv = "0.15.0"
sha2 = "0.10.9"
thiserror = "2.0.17"

[dev-dependencies]
rim_identity = { path = "../rim_identity", features = ["testing"] }
