[package]
name = "rim_auth"
version.workspace = true
edition = "2024"

[dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
getrandom = "0.3.4"
hmac = "0.12.1"
sha2 = "0.10.9"
thiserror = "2.0.17"
tracing = "0.1"

[dependencies.rand_core]
version = "0.6.4"
features = ["getrandom"]

# rand_core is never imported: it is here only to turn on its `getrandom` feature, which
# argon2's re-exported `OsRng` (rim_auth/src/password.rs) needs.
[package.metadata.cargo-machete]
ignored = ["rand_core"]
