[package]
name = "rim_auth"
description = "Password hashing, digests and encoding primitives for RIM"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# `RimKsf::cheap`, a fast key-stretching setting for the client side of OPAQUE in tests.
testing = []

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.99"
argon2 = "0.6.0"
base64 = "0.23.1"
getrandom = "0.3.4"
hkdf = "0.13.0"
hmac = "0.13.0"
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255", "argon2"] }
# The key-exchange hash of the OPAQUE suite: opaque-ke 4.0 takes a digest 0.10 hash.
opaque-sha2 = { package = "sha2", version = "0.10.9" }
sha2 = "0.11.1"
subtle = "2.6"
tracing = "0.1"
zeroize = "1.8"

[dependencies.rand_core]
version = "0.6.4"
features = ["getrandom"]

[dev-dependencies]
rand_chacha = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
