[package]
name = "rim_core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.19.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10"
thiserror = "2"

[dev-dependencies]
mockall = "0.13"
proptest = "1"

[dependencies.mockall]
version = "0.13"
optional = true

[features]
mocks = ["dep:mockall"]
