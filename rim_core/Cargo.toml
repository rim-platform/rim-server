[package]
name = "rim_core"
description = "RIM domain models, repository traits and typed ids"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.19.0", features = ["v7", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10"
thiserror = "2"

[dev-dependencies]
mockall = "0.15"
proptest = "1"

[dependencies.mockall]
version = "0.15"
optional = true

[features]
mocks = ["dep:mockall"]
