[package]
name = "rim_core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1.0.145"
uuid = { version = "1.19.0", features = ["v4", "v7"] }
chrono = "0.4.42"

[dev-dependencies]
mockall = "0.13"

[dependencies.mockall]
version = "0.13"
optional = true

[features]
serde = ["dep:serde", "uuid/serde", "chrono/serde"]
mocks = ["dep:mockall"]
